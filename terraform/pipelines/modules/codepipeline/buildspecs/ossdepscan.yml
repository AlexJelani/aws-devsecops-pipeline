version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing container scanning tools..."
      - pip install --upgrade pip
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
  pre_build:
    commands:
      - echo "Building Docker Container"
      - docker build -t $IMAGE_REPO_NAME:latest .
  build:
    commands:
      - echo "Scanning container for vulnerabilities with Trivy..."
      - mkdir -p reports
      # Fail the build on HIGH and CRITICAL vulnerabilities
      #- ./bin/trivy image --severity HIGH,CRITICAL --exit-code 1 $IMAGE_REPO_NAME:latest
      - ./bin/trivy image --severity HIGH,CRITICAL --format json --output reports/trivy-image.json --exit-code 0 $IMAGE_REPO_NAME:latest
      - ./bin/trivy image --severity HIGH,CRITICAL --exit-code 0 $IMAGE_REPO_NAME:latest > reports/trivy-image.txt
  post_build:
    commands:
      - |
        if [ -n "${SECURITY_REPORTS_BUCKET}" ]; then
          REPORT_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}"
          REPORT_PREFIX="security-reports/${CODEBUILD_BUILD_ID}/trivy"
          echo "Uploading Trivy reports to s3://${SECURITY_REPORTS_BUCKET}/${REPORT_PREFIX}/"
          aws s3 cp reports/ "s3://${SECURITY_REPORTS_BUCKET}/${REPORT_PREFIX}/" --recursive --region "${REPORT_REGION}"
        else
          echo "SECURITY_REPORTS_BUCKET not set; skipping persistent report upload."
        fi
      - echo "Container Scanning completed."

artifacts:
  files:
    - reports/**/*
  discard-paths: no
