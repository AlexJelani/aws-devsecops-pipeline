# remote-write-secret.yaml
#
# Holds the Grafana Cloud Prometheus remote_write Basic Auth credentials
# (username = Instance ID, password = Access Policy token) referenced by
# prometheus.prometheusSpec.remoteWrite.basicAuth in values.yaml.
#
# Do NOT put real credentials in this file or commit them. Instead, create the
# Secret imperatively so the real values only ever exist in your shell/secrets
# manager, never in git history:
#   kubectl -n monitoring create secret generic grafana-cloud-remote-write \
#     --from-literal=username="$GRAFANA_CLOUD_INSTANCE_ID" \
#     --from-literal=password="$GRAFANA_CLOUD_API_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The manifest below is a placeholder for local reference only, applied by
# install-monitoring.sh when no real Secret exists yet.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-remote-write
  namespace: monitoring
type: Opaque
stringData:
  username: "CHANGE_ME_grafana_cloud_instance_id"
  password: "CHANGE_ME_grafana_cloud_api_token"
