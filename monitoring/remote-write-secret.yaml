# remote-write-secret.yaml
#
# Holds the Grafana Cloud Prometheus remote_write API token referenced by
# prometheus.prometheusSpec.remoteWrite in values.yaml.
#
# Replace the placeholder below with your real Grafana Cloud API token before
# applying, ideally via a secrets manager / CI variable substitution rather
# than committing a real value:
#   kubectl -n monitoring create secret generic grafana-cloud-remote-write \
#     --from-literal=api-token="$GRAFANA_CLOUD_API_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-remote-write
  namespace: monitoring
type: Opaque
stringData:
  api-token: "CHANGE_ME_grafana_cloud_api_token"
